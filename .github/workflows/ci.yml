name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (golangci-lint, JPL rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Build with the newest patched Go release. go.mod's "go 1.23" is
          # only the minimum language version; an old toolchain ships known
          # standard-library vulnerabilities (govulncheck fails on them).
          go-version: stable
          check-latest: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

  unit:
    name: Unit tests (race detector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Build with the newest patched Go release. go.mod's "go 1.23" is
          # only the minimum language version; an old toolchain ships known
          # standard-library vulnerabilities (govulncheck fails on them).
          go-version: stable
          check-latest: true
      - name: Module files are tidy
        run: go mod tidy -diff
      - name: Build
        run: go build ./...
      - name: Unit tests
        run: go test -race -count=1 ./...

  integration:
    name: Real containers + coverage (root)
    runs-on: ubuntu-latest
    needs: [lint, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Build with the newest patched Go release. go.mod's "go 1.23" is
          # only the minimum language version; an old toolchain ships known
          # standard-library vulnerabilities (govulncheck fails on them).
          go-version: stable
          check-latest: true
      - name: Build root filesystem
        run: ./scripts/make-rootfs.sh "$RUNNER_TEMP/rootfs"
      - name: All tests as root, with coverage
        run: |
          sudo --preserve-env=PATH,HOME \
            env MKUBE_ROOTFS="$RUNNER_TEMP/rootfs" GOFLAGS=-buildvcs=false \
            "$(which go)" test -count=1 -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Enforce coverage threshold
        run: ./scripts/check-coverage.sh coverage.out 65
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  security:
    name: Security (govulncheck, gosec via lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Build with the newest patched Go release. go.mod's "go 1.23" is
          # only the minimum language version; an old toolchain ships known
          # standard-library vulnerabilities (govulncheck fails on them).
          go-version: stable
          check-latest: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
