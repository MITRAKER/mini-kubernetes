name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: Unit tests (race detector on)
        run: go test -race ./...

  integration:
    name: Real containers (root)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build root filesystem
        run: ./scripts/make-rootfs.sh "$RUNNER_TEMP/rootfs"
      - name: Integration and end-to-end tests
        run: |
          sudo --preserve-env=PATH,HOME,GOPATH,GOMODCACHE,GOCACHE \
            env MKUBE_ROOTFS="$RUNNER_TEMP/rootfs" \
            "$(which go)" test -count=1 -v ./internal/runtime/ ./internal/agent/ ./test/e2e/
