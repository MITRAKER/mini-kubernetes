# Runs the same checks as CI before every commit. Install with:
#   pip install pre-commit && pre-commit install   (or: make tools)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint (JPL rules)
        entry: golangci-lint run --fix
        language: system
        types: [go]
        pass_filenames: false
      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy -diff
        language: system
        files: ^go\.(mod|sum)$
        pass_filenames: false
      - id: go-test
        name: go test (unit)
        entry: go test -race ./...
        language: system
        types: [go]
        pass_filenames: false
